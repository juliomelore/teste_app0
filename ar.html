<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>teste4 · AR</title>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js" />
<link rel="preload" href="alvo.mind" as="fetch" crossorigin />
<link rel="preload" href="teste4.glb" as="fetch" crossorigin />
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","mindar-image-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"}}</script>
<style>

  :root { color-scheme: dark; --bg:#14171c; --painel:#1c2027; --linha:#313843; --tinta:#e7e9ee; --tinta2:#b6bcc7; --destaque:#6b9cf0; --destaque-tinta:#0f1420; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tinta); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  a.botao, button.botao { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border: 1px solid var(--linha); border-radius: 22px; background: var(--painel); color: var(--tinta); font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
  a.botao.principal, button.botao.principal { background: var(--destaque); border-color: var(--destaque); color: var(--destaque-tinta); }

  /* Fundo transparente: o video da camera fica atras do canvas.
     Qualquer cor opaca aqui pinta por cima e a tela fica preta. */
  html, body { height: 100%; background: transparent; overflow: hidden; touch-action: none; }
  #ar { position: fixed; inset: 0; overflow: hidden; }
  #painel-topo { position: fixed; left: 12px; right: 12px; top: 12px; z-index: 20; padding: 10px 14px; border-radius: 10px; background: rgba(20,23,28,.88); font-size: 14px; }
  #painel-topo[hidden] { display: none; }
  #controles { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  #controles button, #controles a { background: rgba(20,23,28,.88); }
  /* A biblioteca desenha o carregando e o scanner por cima; painel e botoes ficam acima. */
  .mindar-ui-overlay { z-index: 10; }
</style>
</head>
<body>
<div id="ar"></div>
<div id="painel-topo">Carregando… aponte a câmera para a imagem de <strong>teste4</strong>.</div>

<div id="controles">
  <button type="button" class="botao" id="btn-menor">Menor</button>
  <button type="button" class="botao" id="btn-maior">Maior</button>
  <button type="button" class="botao" id="btn-girar">Girar</button>
  <a class="botao" href="index.html">Voltar</a>
</div>

<script>
// Navegador sem import map (iOS antes do 16.4) nunca roda o modulo abaixo:
// sem este aviso a pagina ficaria em "Carregando…" para sempre.
setTimeout(function () {
  if (window.__arIniciou) return;
  var p = document.getElementById('painel-topo');
  p.hidden = false;
  p.innerHTML = 'A AR não carregou. Confira a internet e atualize o navegador (no iPhone, iOS 16.4 ou mais novo).';
}, 20000);
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { MindARThree } from 'mindar-image-three';

window.__arIniciou = true;
var CONFIG = {"modelo":"teste4.glb","alvo":"alvo.mind","escala":0.6958942240779401,"filterMinCF":0.0003,"filterBeta":0.1,"missTolerance":5,"warmupTolerance":2};
var LUZ = {"hemisferio":{"ceu":"#dfe6f2","chao":"#2a2d33","intensidade":1.1},"sol":{"cor":"#ffffff","intensidade":2.2,"posicao":[4,8,3]},"ambiente":{"desfoque":0.04}};
var painel = document.getElementById('painel-topo');
function aviso(html) { painel.innerHTML = html; painel.hidden = false; }

// Alguns navegadores embutidos (Instagram, WhatsApp) bloqueiam a camera de
// saida: avisa antes mesmo de tentar, em vez de deixar o usuario esperando.
if (/Instagram|FBAN|FBAV|FB_IAB|Line\/|MicroMessenger|TikTok|WhatsApp/i.test(navigator.userAgent)) {
  aviso('Este link abriu dentro de um aplicativo (Instagram, WhatsApp ou parecido), que costuma bloquear a câmera. ' +
        'Toque nos três pontinhos e escolha <strong>Abrir no navegador</strong>.');
}

var mindar = new MindARThree({
  container: document.getElementById('ar'),
  imageTargetSrc: CONFIG.alvo,
  maxTrack: 1,
  filterMinCF: CONFIG.filterMinCF,
  filterBeta: CONFIG.filterBeta,
  missTolerance: CONFIG.missTolerance,
  warmupTolerance: CONFIG.warmupTolerance,
  uiLoading: 'yes', uiScanning: 'yes', uiError: 'no'
});
var renderer = mindar.renderer, scene = mindar.scene, camera = mindar.camera;
// O MindAR ainda escreve outputEncoding, que o three 0.160 ignora; o espaco de
// cor vai explicito.
renderer.outputColorSpace = THREE.SRGBColorSpace;
// Tela de celular chega a 3x; acima de 2x o custo cresce sem diferenca visivel.
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

var ancora = mindar.addAnchor(0);
var base = new THREE.Group();
base.rotation.x = Math.PI / 2;
var giro = new THREE.Group();
var escalaGrupo = new THREE.Group();
ancora.group.add(base);
base.add(giro);
giro.add(escalaGrupo);

// As mesmas luzes e o mesmo ambiente de reflexo do editor: o que se ve no
// editor e o que aparece aqui. As luzes ficam na base (o espaco do modelo, Y
// para cima), nao na cena: no MindAR o "alto" da cena e o da camera, e a luz
// viria de lado. O ambiente da cor aos materiais metalicos.
base.add(new THREE.HemisphereLight(LUZ.hemisferio.ceu, LUZ.hemisferio.chao, LUZ.hemisferio.intensidade));
var sol = new THREE.DirectionalLight(LUZ.sol.cor, LUZ.sol.intensidade);
sol.position.fromArray(LUZ.sol.posicao);
base.add(sol, sol.target);
var pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), LUZ.ambiente.desfoque).texture;
pmrem.dispose();

var escala = CONFIG.escala;
var angulo = 0;
var sujo = true;
function aplicar() {
  escalaGrupo.scale.setScalar(escala);
  giro.rotation.y = angulo;
  sujo = true;
}
aplicar();

var mixer = null;
new GLTFLoader().loadAsync(CONFIG.modelo).then(function (gltf) {
  // Imagem com recorte (traco fino sobre transparente): bordas suavizadas pelo
  // MSAA. O GLB ja vem sem mipmap nessas texturas (ver Exportador).
  gltf.scene.traverse(function (o) {
    if (!o.isMesh) return;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach(function (m) {
      if (m.alphaTest > 0) m.alphaToCoverage = true;
    });
  });
  escalaGrupo.add(gltf.scene);
  if (gltf.animations && gltf.animations.length) {
    mixer = new THREE.AnimationMixer(gltf.scene);
    gltf.animations.forEach(function (clip) { mixer.clipAction(clip).play(); });
  }
  sujo = true;
}).catch(function () {
  aviso('Não consegui carregar o modelo <code>teste4.glb</code>. Confira se ele está na mesma pasta desta página.');
});

var achou = false;
ancora.onTargetFound = function () { achou = true; painel.hidden = true; sujo = true; };
ancora.onTargetLost = function () { aviso('Imagem perdida. Aponte de novo, enquadrando ela inteira, com boa luz.'); sujo = true; };
ancora.onTargetUpdate = function () { sujo = true; };

// So desenha quando algo mudou: pose nova, animacao, botao. Parado, a GPU
// fica livre para o rastreio (que tambem roda na GPU, pelo tfjs).
var relogio = new THREE.Clock();
function quadro() {
  var dt = relogio.getDelta();
  if (mixer && ancora.visible) { mixer.update(dt); sujo = true; }
  if (!sujo) return;
  sujo = false;
  renderer.render(scene, camera);
}

function liga(id, fn) {
  var el = document.getElementById(id);
  el.addEventListener('click', fn);
  el.addEventListener('touchend', function (e) { e.preventDefault(); fn(); }, { passive: false });
}
liga('btn-maior', function () { escala *= 1.25; aplicar(); });
liga('btn-menor', function () { escala /= 1.25; aplicar(); });
liga('btn-girar', function () { angulo += Math.PI / 4; aplicar(); });

// Gestos: arrastar um dedo gira sobre o papel, pinca muda o tamanho.
var toques = {};
var gesto = null;
// No documento inteiro: o scanner do MindAR cobre a tela e ficaria com o toque.
function ehControle(e) { return e.target && e.target.closest && e.target.closest('#controles, #painel-topo'); }
function distancia(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
document.addEventListener('pointerdown', function (e) {
  if (ehControle(e)) return;
  toques[e.pointerId] = { x: e.clientX, y: e.clientY };
  var ids = Object.keys(toques);
  gesto = ids.length === 2
    ? { tipo: 'pinca', d: distancia(toques[ids[0]], toques[ids[1]]), escala: escala }
    : { tipo: 'giro', x: e.clientX, angulo: angulo };
});
document.addEventListener('pointermove', function (e) {
  if (!toques[e.pointerId] || !gesto) return;
  toques[e.pointerId] = { x: e.clientX, y: e.clientY };
  var ids = Object.keys(toques);
  if (gesto.tipo === 'pinca' && ids.length === 2) {
    var d = distancia(toques[ids[0]], toques[ids[1]]);
    escala = gesto.escala * Math.max(0.05, d / Math.max(1, gesto.d));
  } else if (gesto.tipo === 'giro') {
    angulo = gesto.angulo + (e.clientX - gesto.x) * 0.01;
  }
  aplicar();
});
function soltar(e) { delete toques[e.pointerId]; if (!Object.keys(toques).length) gesto = null; }
document.addEventListener('pointerup', soltar);
document.addEventListener('pointercancel', soltar);

// Aba em segundo plano: para o rastreio e o desenho (bateria e calor).
document.addEventListener('visibilitychange', function () {
  if (!mindar.controller || !mindar.video) return;
  if (document.hidden) {
    mindar.controller.stopProcessVideo();
    renderer.setAnimationLoop(null);
  } else {
    mindar.controller.processVideo(mindar.video);
    renderer.setAnimationLoop(quadro);
  }
});

// Foco continuo: em muitos Android a camera aberta pelo navegador fica com o
// foco fixo, e a imagem impressa de perto sai borrada e sem pontos.
function focarSempre() {
  try {
    var trilha = mindar.video.srcObject.getVideoTracks()[0];
    var cap = trilha.getCapabilities ? trilha.getCapabilities() : {};
    if (cap.focusMode && cap.focusMode.indexOf('continuous') >= 0) {
      trilha.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {});
    }
  } catch (e) { /* sem suporte: segue com o foco do aparelho */ }
}

mindar.start().then(function () {
  focarSempre();
  renderer.setAnimationLoop(quadro);
  if (!achou) aviso('Câmera ligada. Aponte para a imagem de <strong>teste4</strong>, enquadrando ela inteira.');
}).catch(function () {
  if (mindar.ui) mindar.ui.hideLoading();
  aviso('Não consegui abrir a câmera. Permita o acesso e recarregue a página. ' +
        'Se abriu pelo Instagram ou WhatsApp, toque em <strong>Abrir no navegador</strong>. ' +
        'A câmera também exige um endereço https://.');
});
</script>
</body>
</html>
