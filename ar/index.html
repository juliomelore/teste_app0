<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>teste · AR</title>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.3.0/dist/aframe-master.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: system-ui, sans-serif; }
  #arjs-video, video { object-fit: cover !important; }
  .a-canvas { background: transparent !important; }
  #controles { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; pointer-events: auto;
    display: flex; gap: 8px; justify-content: center; padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  #controles button { min-height: 44px; padding: 0 16px; border: 0; border-radius: 22px; background: rgba(20,23,28,.85); color: #fff; font: 600 15px system-ui, sans-serif; }
  #dica { position: fixed; left: 12px; right: 12px; top: 12px; z-index: 20; padding: 10px 14px; border-radius: 10px; background: rgba(20,23,28,.85); color: #fff; font-size: 14px; line-height: 1.4; }
  #dica[hidden] { display: none; }
</style>
</head>
<body>
<div id="dica">Aponte a câmera para o marcador impresso de <strong>teste</strong>.</div>
<div id="controles">
  <button type="button" id="btn-maior">Maior</button>
  <button type="button" id="btn-menor">Menor</button>
  <button type="button" id="btn-girar">Girar</button>
</div>

<a-scene embedded vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true; colorManagement: true; physicallyCorrectLights: true"
  arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; patternRatio: 0.5; cameraParametersUrl: ./camera_para.dat; debugUIEnabled: false;">
  <a-assets>
    <a-asset-item id="modelo" src="../teste.glb"></a-asset-item>
  </a-assets>
  <a-marker type="pattern" url="./marcador.patt" smooth="true" smoothCount="10" smoothTolerance="0.02" smoothThreshold="5" id="marcador">
    <!-- No espaco do marcador o papel e o plano XZ e +Y e a normal; o glTF (Y para cima) fica em pe sem rotacao. -->
    <a-entity id="conteudo" gltf-model="#modelo" position="0 0 0" scale="1 1 1"></a-entity>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>

<script>
(function () {
  var conteudo = document.getElementById('conteudo');
  var dica = document.getElementById('dica');
  var marcador = document.getElementById('marcador');
  var escala = 1;
  var giro = 0;
  function aplicar() {
    conteudo.setAttribute('scale', escala + ' ' + escala + ' ' + escala);
    conteudo.setAttribute('rotation', '0 ' + giro + ' 0');
  }
  function liga(id, fn) {
    var el = document.getElementById(id);
    el.addEventListener('click', fn);
    el.addEventListener('touchend', function (e) { e.preventDefault(); fn(); }, { passive: false });
  }
  liga('btn-maior', function () { escala *= 1.25; aplicar(); });
  liga('btn-menor', function () { escala /= 1.25; aplicar(); });
  liga('btn-girar', function () { giro = (giro + 45) % 360; aplicar(); });
  marcador.addEventListener('markerFound', function () { dica.hidden = true; });
  marcador.addEventListener('markerLost', function () { dica.hidden = false; dica.textContent = 'Marcador perdido. Aponte de novo, com boa luz.'; });
  setTimeout(function () {
    var cam = document.querySelector('video#arjs-video') || document.querySelector('video');
    var ok = cam && cam.srcObject && !cam.paused && cam.videoWidth > 0;
    if (!ok) dica.innerHTML = 'Não consegui acessar a câmera. Permita o acesso e recarregue. Se abriu pelo Instagram ou WhatsApp, toque em <strong>Abrir no navegador</strong>.';
  }, 7000);
})();
</script>
</body>
</html>
